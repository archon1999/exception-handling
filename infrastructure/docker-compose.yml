version: '3.8'

services:
  nexus:
    image: sonatype/nexus3
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - nexus-data:/nexus-data
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms128m -Xmx1024m -XX:MaxDirectMemorySize=1024m"

volumes:
  nexus-data:
